name: Release Validation

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read
  actions: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release validation (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify annotated tag and tested public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -notlike 'refs/tags/v*') { throw 'Dispatch this workflow on an annotated release tag.' }
          ./scripts/test-published-release.ps1 -SourceSha $env:GITHUB_SHA -Tag $env:GITHUB_REF_NAME
      - name: Retain tag verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: navlyn-tag-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/tag-provenance
            artifacts/validated-release-provenance
            artifacts/tag-public-verification
          if-no-files-found: warn
          retention-days: 90
