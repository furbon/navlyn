name: Release Validation

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read
  actions: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release validation (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify annotated tag and tested public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -notlike 'refs/tags/v*') { throw 'Dispatch this workflow on an annotated release tag.' }
          ./scripts/invoke-ci-step.ps1 -Name published-release -FilePath pwsh -Arguments @('-NoProfile','-File','./scripts/test-published-release.ps1','-SourceSha',$env:GITHUB_SHA,'-Tag',$env:GITHUB_REF_NAME)
      - name: Retain tag verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: navlyn-tag-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/tag-provenance
            artifacts/validated-release-provenance
            artifacts/tag-public-verification
            artifacts/ci-diagnostics
          if-no-files-found: warn
          retention-days: 90
