name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      NAVLYN_TEST_CONFIGURATION: Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Build once
        shell: pwsh
        run: ./scripts/invoke-ci-step.ps1 -Name build -FilePath dotnet -Arguments @('build','navlyn.slnx','-c','Release')
      - name: Select affected tests for a PR follow-up
        id: tests
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          $filter = if ('${{ matrix.os }}' -eq 'windows-latest') { '' } else { 'FullyQualifiedName~NavlynCliRunnerTests|FullyQualifiedName~NavlynMcpServerOptionsTests|FullyQualifiedName~PathDisplayTests|FullyQualifiedName~StdioServer_ListsToolsAndMapsSuccessAndCliErrors|FullyQualifiedName~FocusedSurface_PreservesIdentityBoundsAndFullOverride|FullyQualifiedName~OutlineResolverComponentTests|FullyQualifiedName~NavlynMcpTimingScopeTests' }
          if ($env:EVENT_ACTION -eq 'synchronize' -and $env:BEFORE_SHA -match '^[a-f0-9]{40}$') {
            $changed = @(git diff --name-only $env:BEFORE_SHA $env:GITHUB_SHA)
            $product = @($changed | Where-Object { $_ -match '^(Navlyn.Core|Navlyn.CommandLine|navlyn|navlyn.Mcp)/|^Directory\.|^global.json|^NuGet\.[Cc]onfig|^tests/fixtures/|^navlyn.slnx|^navlyn.Tests/(TestSupport|Contracts/GoldenSnapshots|.*\.csproj)|^navlyn.Tests/(?!.*Tests\.cs$).*\.cs$|^docs/schemas/' })
            if ($product.Count -eq 0) {
              $classes = @($changed | Where-Object { $_ -match '^navlyn.Tests/.+Tests\.cs$' } | ForEach-Object { 'FullyQualifiedName~' + [IO.Path]::GetFileNameWithoutExtension($_) })
              if (@($changed | Where-Object { $_ -like '.agents/skills/*' }).Count) { $classes += 'FullyQualifiedName~NavlynRoutingSkillContractTests' }
              $filter = if ($classes.Count) { $classes -join '|' } else { 'FullyQualifiedName~NavlynMcpServerOptionsTests' }
            }
          }
          "filter=$filter" | Add-Content $env:GITHUB_OUTPUT
      - name: Product tests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          $arguments = @('test','navlyn.Tests/navlyn.Tests.csproj','--no-build','-c','Release','--framework','net10.0','--logger','trx;LogFileName=product.trx','--results-directory','artifacts/ci-diagnostics/tests')
          if ('${{ steps.tests.outputs.filter }}') { $arguments += @('--filter','${{ steps.tests.outputs.filter }}') }
          ./scripts/invoke-ci-step.ps1 -Name product-tests -FilePath dotnet -Arguments $arguments
      - name: Portable transport tests
        if: matrix.os != 'windows-latest'
        shell: pwsh
        env:
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/invoke-ci-step.ps1 -Name transport-tests -FilePath dotnet -Arguments @('test','navlyn.Tests/navlyn.Tests.csproj','--no-build','-c','Release','--framework','net10.0','--filter','${{ steps.tests.outputs.filter }}','--logger','trx;LogFileName=transport.trx','--results-directory','artifacts/ci-diagnostics/tests')
      - name: Portable CLI smoke
        shell: pwsh
        run: ./scripts/invoke-ci-step.ps1 -Name portable-cli -FilePath pwsh -Arguments @('-NoProfile','-File','./scripts/test-portable-smoke.ps1','-Configuration','Release')
      - name: Fast release checks
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/invoke-ci-step.ps1 -Name release-checks -FilePath pwsh -Arguments @('-NoProfile','-File','./scripts/test-release.ps1','-NoBuild','-SkipDotnetTest','-Configuration','Release')
      - name: Pack tested build
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/invoke-ci-step.ps1 -Name pack -FilePath pwsh -Arguments @('-NoProfile','-File','./scripts/pack-release.ps1','-NoValidation','-NoBuild','-Output','artifacts/ci-candidate')
          ./scripts/invoke-ci-step.ps1 -Name package-contract -FilePath pwsh -Arguments @('-NoProfile','-File','./scripts/test-package-contract.ps1','-Manifest','artifacts/ci-candidate/navlyn-release-pack.json')
      - name: Installed package smoke
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/ci-checks -Force | Out-Null
          ./scripts/invoke-ci-step.ps1 -Name consumer-install -FilePath pwsh -Arguments @('-NoProfile','-File','./scripts/test-consumer-install.ps1','-Manifest','artifacts/ci-candidate/navlyn-release-pack.json','-Frameworks','net10.0','-OutputReport',(Join-Path $PWD 'artifacts/ci-checks/consumer-install.json'))
      - name: Prepare validated release inputs
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        shell: pwsh
        run: |
          ./scripts/invoke-ci-step.ps1 -Name setup-bundle -FilePath pwsh -Arguments @('-NoProfile','-File','./scripts/build-setup-bundle.ps1','-Output','artifacts/setup-bundle','-SourceCommit',$env:GITHUB_SHA)
          ./scripts/invoke-ci-step.ps1 -Name publication-inputs -FilePath pwsh -Arguments @('-NoProfile','-File','./scripts/prepare-publication-inputs.ps1','-SourceSha',$env:GITHUB_SHA,'-SetupBundle','artifacts/setup-bundle.zip','-Manifest','artifacts/ci-candidate/navlyn-release-pack.json')
      - name: Retain validated release inputs
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: navlyn-validated-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication-inputs
          if-no-files-found: error
          retention-days: 90
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: navlyn-ci-diagnostics-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-diagnostics
          if-no-files-found: warn
          retention-days: 30
